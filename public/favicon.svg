<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- White background circle -->
  <circle cx="32" cy="32" r="32" fill="white"/>

  <!-- Golden dot at top (like i-dot) -->
  <circle cx="22" cy="8" r="7" fill="#f0a500"/>

  <!-- Large S letter - dark forest green, serif bold -->
  <text x="4" y="55"
    font-family="Georgia, serif"
    font-size="56"
    font-weight="900"
    fill="#1e5631">S</text>

  <!-- Small donut pie chart (green + amber) top-right area -->
  <!-- center(50,16) r=12 -->
  <!-- Green 270deg: start top(50,4) -> left(38,16) -->
  <path d="M50,16 L50,4 A12,12,0,1,1,38,16 Z" fill="#2e7d32"/>
  <!-- Amber 90deg: left(38,16) -> top(50,4) -->
  <path d="M50,16 L38,16 A12,12,0,0,1,50,4 Z" fill="#f0a500"/>
  <!-- White donut hole -->
  <circle cx="50" cy="16" r="5.5" fill="white"/>

</svg>